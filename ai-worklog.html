<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dopamodoro — AI Worklog</title>
  <style>
    :root{color-scheme:dark;--bg:#100b1e;--card:#1b1430;--card2:#251b3d;--text:#f7f2ff;--muted:#a99dbd;--line:#382a51;--accent:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#23143c 0,var(--bg) 38%);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}
    .wrap{max-width:920px;margin:auto;padding:22px 16px 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:21px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.back{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#1a122b}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.stat{background:rgba(27,20,48,.92);border:1px solid var(--line);border-radius:16px;padding:13px}.n{font-weight:900;font-size:24px}.l{color:var(--muted);font-size:12px;margin-top:3px}
    .toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:14px}.chip{white-space:nowrap;border:1px solid var(--line);background:#19112c;color:var(--text);padding:8px 11px;border-radius:999px;cursor:pointer}.chip.on{border-color:#fb7185;background:#32162a}
    .group{margin:18px 0}.ghead{font-weight:800;font-size:15px;margin:0 0 9px;display:flex;justify-content:space-between}.task{background:rgba(27,20,48,.94);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.task.done{opacity:.65}.row{display:flex;align-items:flex-start;gap:10px}.check{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:2px solid #66547f;display:grid;place-items:center;font-weight:900}.done .check{background:#42223d;border-color:#fb7185}.title{font-weight:750;line-height:1.35}.done .title{text-decoration:line-through}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{font-size:11px;color:#d9cde8;background:#2a203d;border:1px solid #43345a;border-radius:999px;padding:4px 7px}.p1{border-color:#fb7185}.p2{border-color:#f59e0b}.notes{margin:10px 0 0 32px;color:var(--muted);font-size:12px;line-height:1.5}.notes li{margin:3px 0}.empty{text-align:center;color:var(--muted);padding:40px}.updated{font-size:12px;color:var(--muted);margin-top:4px}
    @media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.back{font-size:12px}.wrap{padding-top:16px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">🍅 Dopamodoro — AI Worklog</div><div class="sub">Tasks created and completed while working with ChatGPT</div><div class="updated" id="updated"></div></div><a class="back" href="./">Open Dopamodoro</a></div>
  <div class="stats"><div class="stat"><div class="n" id="openN">—</div><div class="l">Open</div></div><div class="stat"><div class="n" id="doneN">—</div><div class="l">Completed</div></div><div class="stat"><div class="n" id="p1N">—</div><div class="l">Priority 1 open</div></div><div class="stat"><div class="n" id="todayN">—</div><div class="l">Completed today</div></div></div>
  <div class="toolbar" id="filters"></div><div id="content"></div>
</div>
<script>
let DATA=null, FILTER='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function day(v){if(!v)return'';try{return new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}catch{return v}}
function render(){
 const groups=DATA.groups||[], todos=(DATA.todos||[]).slice().sort((a,b)=>(a.done-b.done)||((a.priority||3)-(b.priority||3))||String(a.createdAt).localeCompare(String(b.createdAt)));
 const today=new Date().toDateString();
 openN.textContent=todos.filter(t=>!t.done).length; doneN.textContent=todos.filter(t=>t.done).length; p1N.textContent=todos.filter(t=>!t.done&&t.priority===1).length; todayN.textContent=todos.filter(t=>t.done&&t.completedAt&&new Date(t.completedAt.length===10?t.completedAt+'T12:00:00':t.completedAt).toDateString()===today).length;
 updated.textContent='Updated: '+day(DATA.updatedAt);
 const fs=[['all','All'],['open','Open'],['done','Completed'],...groups.map(g=>[g.id,g.name])];
 filters.innerHTML=fs.map(([id,n])=>`<button class="chip ${FILTER===id?'on':''}" data-f="${esc(id)}">${esc(n)}</button>`).join(''); filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render()});
 const filtered=todos.filter(t=>FILTER==='all'||(FILTER==='open'&&!t.done)||(FILTER==='done'&&t.done)||t.groupId===FILTER);
 const by=new Map(); filtered.forEach(t=>{const k=t.groupId||'_';if(!by.has(k))by.set(k,[]);by.get(k).push(t)});
 if(!filtered.length){content.innerHTML='<div class="empty">No tasks in this view.</div>';return}
 content.innerHTML=[...by.entries()].map(([gid,ts])=>{const g=groups.find(x=>x.id===gid);return `<section class="group"><div class="ghead"><span>${esc(g?.name||'Ungrouped')}</span><span>${ts.filter(t=>!t.done).length} open</span></div>${ts.map(taskHtml).join('')}</section>`}).join('');
}
function taskHtml(t){const notes=(t.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');const blocked=t.blockedBy?`<span class="tag">Waiting: ${esc(t.blockedBy)}</span>`:'';return `<article class="task ${t.done?'done':''} p${t.priority||3}"><div class="row"><div class="check">${t.done?'✓':''}</div><div><div class="title">${esc(t.text)}</div><div class="meta"><span class="tag">Priority ${t.priority||3}</span><span class="tag">Created ${day(t.createdAt)}</span>${t.completedAt?`<span class="tag">Completed ${day(t.completedAt)}</span>`:''}${blocked}</div></div></div>${notes?`<ul class="notes">${notes}</ul>`:''}</article>`}
fetch('./ai-tasks.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{DATA=d;render()}).catch(e=>content.innerHTML='<div class="empty">Could not load AI worklog: '+esc(e.message)+'</div>');
</script>
</body>
</html>
