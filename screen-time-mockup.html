<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e6" />
  <title>MOKI — Screen Time Loop</title>
  <style>
    :root {
      color-scheme: light;
      --ivory: #f6f1e6;
      --paper: #fffdf8;
      --forest: #102b20;
      --forest-2: #173c2c;
      --ink: #142019;
      --muted: #6d756f;
      --line: rgba(20,32,25,.11);
      --lime: #c9f36b;
      --lime-ink: #102013;
      --sage: #dfe9dc;
      --soft: #ece7db;
      --danger: #b94b47;
      --shadow: 0 24px 80px rgba(37, 50, 39, .15);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --tap: 52px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ivory); color: var(--ink); }
    body {
      min-height: 100dvh;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(201,243,107,.23), transparent 26rem),
        radial-gradient(circle at 84% 88%, rgba(23,60,44,.08), transparent 28rem),
        var(--ivory);
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(16,43,32,.28); outline-offset: 3px; }

    .phone {
      width: min(100%, 430px);
      min-height: min(820px, calc(100dvh - 36px));
      background: var(--paper);
      border: 1px solid rgba(16,43,32,.10);
      border-radius: 42px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      height: 32px;
      flex: 0 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .status-icons { display: flex; align-items: center; gap: 6px; color: var(--forest); }
    .status-icons svg { width: 15px; height: 15px; stroke-width: 2; }

    .app-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 22px 8px;
      min-height: 60px;
    }

    .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
    .fox-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--forest);
      color: var(--lime);
      flex: 0 0 34px;
    }
    .fox-mark svg { width: 24px; height: 24px; }
    .brand strong { font-size: 17px; letter-spacing: .06em; }
    .brand span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: var(--forest);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .icon-btn:hover { background: rgba(16,43,32,.06); }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn svg { width: 21px; height: 21px; }

    .screen-wrap { flex: 1; min-height: 0; display: flex; }
    .screen {
      width: 100%;
      flex: 1;
      min-height: 0;
      padding: 18px 22px 24px;
      display: flex;
      flex-direction: column;
      animation: enter .24s ease both;
    }
    .screen.dark {
      color: #f8fbf4;
      background:
        radial-gradient(circle at 50% 25%, rgba(201,243,107,.12), transparent 18rem),
        linear-gradient(180deg, #112b20, #0a1c15);
      margin-top: -68px;
      padding-top: 86px;
    }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #6b746d;
      margin: 0 0 10px;
    }
    .dark .eyebrow { color: rgba(248,251,244,.58); }
    h1 { font-size: clamp(30px, 8.2vw, 38px); line-height: 1.02; letter-spacing: -.045em; margin: 0; max-width: 11ch; }
    h2 { font-size: 24px; line-height: 1.08; letter-spacing: -.035em; margin: 0; }
    p { margin: 0; }
    .sub { color: var(--muted); font-size: 16px; line-height: 1.5; margin-top: 12px; max-width: 33ch; }
    .dark .sub { color: rgba(248,251,244,.68); }

    .hero-card {
      margin-top: 24px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, #f1eadc, #fffdf8 62%);
    }
    .balance-row { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .balance-label { font-size: 13px; color: var(--muted); font-weight: 650; }
    .balance { font-size: 42px; font-weight: 850; letter-spacing: -.055em; color: var(--forest); margin-top: 5px; }
    .balance small { font-size: 14px; letter-spacing: 0; color: var(--muted); margin-left: 4px; }
    .mini-ring {
      width: 64px; height: 64px; border-radius: 50%;
      background: conic-gradient(var(--forest) 0 22%, var(--sage) 22% 100%);
      position: relative; flex: 0 0 auto;
    }
    .mini-ring::after { content:""; position:absolute; inset:8px; border-radius:50%; background:var(--paper); }

    .section-title { margin: 25px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-title strong { font-size: 15px; }
    .section-title span { font-size: 12px; color: var(--muted); }

    .app-list { display: grid; gap: 10px; }
    .app-row {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 13px;
      background: #fff;
    }
    .app-icon {
      width: 42px; height: 42px; border-radius: 13px; display:grid; place-items:center;
      flex: 0 0 auto; color: white; font-weight: 900; font-size: 17px;
    }
    .ig { background: radial-gradient(circle at 30% 110%, #ffd600 0 18%, #ff7a00 34%, #ff0169 56%, #d300c5 76%, #7638fa 100%); }
    .tt { background: #0b0b0d; }
    .yt { background: #f21f2f; }
    .app-copy { min-width: 0; flex: 1; }
    .app-copy strong { display: block; font-size: 15px; }
    .app-copy span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .pill { flex: 0 0 auto; font-size: 11px; font-weight: 800; padding: 7px 9px; border-radius: 999px; background: var(--sage); color: var(--forest); }

    .spacer { flex: 1; min-height: 18px; }
    .button-stack { display: grid; gap: 10px; margin-top: 20px; }
    .btn {
      width: 100%;
      min-height: var(--tap);
      border: 0;
      border-radius: 16px;
      padding: 13px 16px;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.15;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease, background .18s ease;
    }
    .btn:active { transform: scale(.985); }
    .btn.primary { background: var(--forest); color: #fff; }
    .btn.lime { background: var(--lime); color: var(--lime-ink); }
    .btn.secondary { background: var(--soft); color: var(--ink); }
    .btn.ghost { background: transparent; color: var(--forest); border: 1px solid var(--line); }
    .btn:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    .dark .btn.secondary { background: rgba(255,255,255,.09); color: #fff; }
    .dark .btn.ghost { color: #fff; border-color: rgba(255,255,255,.14); }

    .back {
      display: inline-flex; align-items: center; gap: 7px; color: var(--forest); background: none; border:0;
      min-height: 44px; padding: 0; font-weight: 750; cursor:pointer; margin-bottom: 14px; align-self: flex-start;
    }
    .back svg { width: 18px; height: 18px; }
    .dark .back { color: #fff; }

    .intercept {
      margin-top: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .big-app-icon {
      width: 72px; height: 72px; border-radius: 23px; display:grid; place-items:center; color:#fff; font-size: 28px; font-weight:900;
      box-shadow: 0 14px 28px rgba(89,58,50,.16);
    }
    .intercept h1 { margin-top: 16px; max-width: none; font-size: 32px; }
    .paused { margin-top: 6px; color: var(--muted); font-size: 14px; font-weight: 650; }
    .intent-card {
      width:100%; margin-top: 26px; padding: 19px; border-radius: var(--radius-lg); background: var(--soft); text-align:left;
    }
    .intent-card span { display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .intent-card strong { display:block; font-size: 18px; line-height: 1.35; max-width: 25ch; }
    .tiny-link { margin-top: 13px; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; background:none; border:0; min-height:44px; cursor:pointer; }

    .quest-list { display: grid; gap: 10px; margin-top: 22px; }
    .quest {
      width: 100%; min-height: 76px; background:#fff; border:1px solid var(--line); border-radius:20px;
      padding: 13px; display:flex; align-items:center; gap:13px; text-align:left; cursor:pointer; position:relative;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .quest:active { transform: scale(.988); }
    .quest.selected { border-color: var(--forest); background: #f3f7ee; box-shadow: 0 0 0 1px var(--forest) inset; }
    .quest-icon { width:44px; height:44px; border-radius:14px; background:var(--sage); color:var(--forest); display:grid; place-items:center; flex:0 0 auto; }
    .quest-icon svg { width:22px; height:22px; }
    .quest-copy { flex:1; min-width:0; }
    .quest-copy strong { display:block; font-size:15px; }
    .quest-copy span { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .reward { flex:0 0 auto; font-size:13px; font-weight:850; color:var(--forest); background:var(--lime); padding:8px 10px; border-radius:12px; }

    .timer-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 420px; }
    .timer-ring {
      width: min(68vw, 260px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
      background: conic-gradient(var(--lime) 0 var(--progress, 5%), rgba(255,255,255,.10) var(--progress, 5%) 100%);
      position:relative; box-shadow: 0 0 60px rgba(201,243,107,.08);
    }
    .timer-ring::after { content:""; position:absolute; inset:12px; border-radius:50%; background:#0d2319; }
    .timer-value { position:relative; z-index:1; font-size:50px; font-weight:850; letter-spacing:-.055em; }
    .timer-label { position:relative; z-index:1; font-size:13px; color:rgba(248,251,244,.62); margin-top:6px; }
    .trust { color: rgba(248,251,244,.66); font-size: 13px; margin-top: 25px; }

    .celebrate { text-align:center; align-items:center; justify-content:center; }
    .check-orb {
      width:76px; height:76px; border-radius:50%; display:grid; place-items:center; background:var(--forest); color:var(--lime); margin-bottom:22px;
    }
    .check-orb svg { width:38px; height:38px; }
    .earned-number { font-size: 76px; font-weight: 900; letter-spacing: -.07em; color: var(--forest); margin-top: 28px; line-height:.9; }
    .earned-number span { display:block; font-size:15px; letter-spacing:0; color:var(--muted); margin-top:12px; }
    .confetti { display:flex; gap:8px; margin:28px 0 4px; height:24px; align-items:center; }
    .confetti i { display:block; width:8px; height:16px; border-radius:4px; background:var(--forest); transform:rotate(var(--r)); opacity:var(--o); }
    .confetti i:nth-child(2n) { background:#dfab58; }
    .confetti i:nth-child(3n) { background:var(--lime); }

    .active-app { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; color:rgba(248,251,244,.75); font-weight:750; }
    .active-app .app-icon { width:34px; height:34px; border-radius:11px; font-size:13px; }

    .lock-orb {
      width:84px; height:84px; border-radius:28px; display:grid; place-items:center; background:var(--soft); color:var(--forest); margin:34px auto 0;
    }
    .lock-orb svg { width:38px; height:38px; }
    .relock-copy { text-align:center; }
    .relock-copy h1 { max-width:none; margin:24px auto 0; }
    .relock-copy .sub { margin-left:auto; margin-right:auto; }

    .toast {
      position:absolute; left:18px; right:18px; bottom:20px; z-index:20; background:#102b20; color:white;
      border-radius:16px; padding:13px 15px; font-size:13px; font-weight:700; box-shadow:0 14px 32px rgba(16,43,32,.22);
      transform:translateY(12px); opacity:0; pointer-events:none; transition:.2s ease;
    }
    .toast.show { transform:none; opacity:1; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    @media (max-width: 460px) {
      body { padding: 0; display:block; background:var(--paper); }
      .phone { width:100%; min-height:100dvh; border:0; border-radius:0; box-shadow:none; }
      .screen { padding-left: 20px; padding-right: 20px; }
      .topbar { padding-left: 20px; padding-right:20px; }
    }

    @media (max-width: 370px) {
      .screen { padding-left: 17px; padding-right: 17px; }
      .topbar { padding-left: 17px; padding-right:17px; }
      h1 { font-size: 31px; }
      .reward { font-size: 12px; padding: 8px; }
      .quest { gap: 10px; padding: 11px; }
      .quest-icon { width:40px; height:40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="MOKI screen time prototype">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 18h2M7 15h2M11 12h2M15 9h2M19 6h2"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 9a12 12 0 0 1 16 0M7 12a8 8 0 0 1 10 0M10 15a4 4 0 0 1 4 0"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 28 14" fill="none" stroke="currentColor"><rect x="1" y="1" width="23" height="12" rx="3"/><path d="M26 5v4"/><rect x="3" y="3" width="17" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="app-shell">
      <header class="topbar" id="topbar">
        <div class="brand">
          <div class="fox-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M6 8 12 11 16 9l4 2 6-3-2 10c-.8 5-4 8-8 8s-7.2-3-8-8L6 8Z" fill="currentColor"/>
              <path d="M10.5 17.3c1.6-1.8 3.4-2.7 5.5-2.7 2.1 0 3.9.9 5.5 2.7-1 3.6-2.9 5.4-5.5 5.4-2.6 0-4.5-1.8-5.5-5.4Z" fill="#102b20"/>
              <circle cx="12.4" cy="16.1" r="1" fill="#102b20"/><circle cx="19.6" cy="16.1" r="1" fill="#102b20"/>
              <path d="m14.4 19.2 1.6 1.2 1.6-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div><strong>MOKI</strong><span>Less autopilot. More life.</span></div>
        </div>
        <button class="icon-btn" id="resetBtn" type="button" aria-label="Reset prototype" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </header>
      <div class="screen-wrap" id="screenWrap" aria-live="polite"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <div class="sr-only" id="announce" aria-live="assertive"></div>

  <script>
    (() => {
      'use strict';

      const screenWrap = document.getElementById('screenWrap');
      const topbar = document.getElementById('topbar');
      const resetBtn = document.getElementById('resetBtn');
      const toast = document.getElementById('toast');
      const announce = document.getElementById('announce');

      const state = {
        screen: 'home',
        selectedQuest: 'read',
        questReward: 10,
        earnedMinutes: 0,
        activeMinutes: 0,
        activeReason: 'earned',
        timerSeconds: 300,
        timerInitial: 300,
        timerId: null
      };

      const icons = {
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
        book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>',
        walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="m10 22 2-7-3-3 3-4 3 3 3 1"/><path d="m14 15 2 3v4"/><path d="M7 11 4 14"/></svg>',
        tidy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 21 9-9"/><path d="m14 3 7 7-9 9-7-7 9-9Z"/><path d="m5 14 5 5"/></svg>',
        stretch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M4 9h16M12 6v8M8 22l4-8 4 8"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
        lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
      };

      const quests = {
        read: { title: 'Read 5 pages', meta: 'Put the phone face down', reward: 10, icon: icons.book },
        walk: { title: 'Walk outside for 5 min', meta: 'No feed, no headphones', reward: 10, icon: icons.walk },
        tidy: { title: 'Reset one small surface', meta: 'Desk, shelf, or kitchen counter', reward: 8, icon: icons.tidy },
        stretch: { title: 'Stretch for 3 min', meta: 'Just enough to change state', reward: 5, icon: icons.stretch }
      };

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.max(0, seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function clearTimer() {
        if (state.timerId) window.clearInterval(state.timerId);
        state.timerId = null;
      }

      function notify(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(notify.timeout);
        notify.timeout = window.setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function go(screen) {
        clearTimer();
        state.screen = screen;
        render();
        announce.textContent = `Opened ${screen.replace('-', ' ')} screen`;
      }

      function backButton(target = 'home') {
        return `<button class="back" type="button" data-go="${target}">${icons.arrow}<span>Back</span></button>`;
      }

      function appRow(name, iconClass, letter, detail) {
        return `<div class="app-row">
          <div class="app-icon ${iconClass}" aria-hidden="true">${letter}</div>
          <div class="app-copy"><strong>${name}</strong><span>${detail}</span></div>
          <span class="pill">Paused</span>
        </div>`;
      }

      function homeScreen() {
        return `<section class="screen" data-screen="home">
          <p class="eyebrow">Screen time</p>
          <h1>Your day, not your feed.</h1>
          <p class="sub">When autopilot hits, MOKI gives you one small offline choice before the scroll.</p>

          <div class="hero-card">
            <div class="balance-row">
              <div><div class="balance-label">Screen time bank</div><div class="balance">${state.earnedMinutes}<small>min</small></div></div>
              <div class="mini-ring" aria-hidden="true"></div>
            </div>
          </div>

          <div class="section-title"><strong>Paused apps</strong><span>3 apps</span></div>
          <div class="app-list">
            ${appRow('Instagram', 'ig', 'I', 'Unlock with a Side Quest')}
            ${appRow('TikTok', 'tt', 'T', 'Unlock with a Side Quest')}
            ${appRow('YouTube', 'yt', '▶', 'Unlock with a Side Quest')}
          </div>
          <div class="spacer"></div>
          <div class="button-stack">
            <button class="btn primary" type="button" data-go="locked">Open Instagram</button>
          </div>
        </section>`;
      }

      function lockedScreen() {
        const canUse = state.earnedMinutes > 0;
        return `<section class="screen" data-screen="locked">
          ${backButton('home')}
          <div class="intercept">
            <div class="big-app-icon ig" aria-hidden="true">I</div>
            <h1>Instagram is paused.</h1>
            <div class="paused">Take a moment before the feed.</div>
            <div class="intent-card">
              <span>You said you wanted more</span>
              <strong>Reading in your actual day.</strong>
            </div>
          </div>
          <div class="spacer"></div>
          <div class="button-stack">
            <button class="btn primary" type="button" data-go="quests">Take a Side Quest</button>
            <button class="btn secondary" type="button" data-action="use-bank" ${canUse ? '' : 'disabled'}>Use ${state.earnedMinutes} earned min</button>
            <button class="btn ghost" type="button" data-action="intentional">Intentional unlock · 10 min</button>
          </div>
          <button class="tiny-link" type="button" data-action="urgent">Need it right now?</button>
        </section>`;
      }

      function questsScreen() {
        const cards = Object.entries(quests).map(([key, q]) => `
          <button class="quest ${state.selectedQuest === key ? 'selected' : ''}" type="button" data-quest="${key}" aria-pressed="${state.selectedQuest === key}">
            <span class="quest-icon">${q.icon}</span>
            <span class="quest-copy"><strong>${q.title}</strong><span>${q.meta}</span></span>
            <span class="reward">+${q.reward} min</span>
          </button>`).join('');
        return `<section class="screen" data-screen="quests">
          ${backButton('locked')}
          <p class="eyebrow">Choose your path</p>
          <h1>Do one small thing in real life.</h1>
          <p class="sub">Finish it, earn intentional screen time, then decide what you want next.</p>
          <div class="quest-list">${cards}</div>
          <div class="spacer"></div>
          <div class="button-stack"><button class="btn primary" type="button" data-action="start-quest">Start Side Quest</button></div>
        </section>`;
      }

      function questTimerScreen() {
        const q = quests[state.selectedQuest];
        return `<section class="screen dark" data-screen="quest-timer">
          ${backButton('quests')}
          <p class="eyebrow">Side Quest</p>
          <h2>${q.title}</h2>
          <div class="timer-center">
            <div class="timer-ring" id="questRing" style="--progress:0%">
              <div><div class="timer-value" id="questTime">${formatTime(state.timerSeconds)}</div><div class="timer-label">left</div></div>
            </div>
            <p class="trust">Nothing else to consume. Just do the thing.</p>
          </div>
          <div class="button-stack"><button class="btn lime" type="button" data-action="finish-quest">I’m done</button></div>
        </section>`;
      }

      function earnedScreen() {
        return `<section class="screen celebrate" data-screen="earned">
          <div class="check-orb">${icons.check}</div>
          <p class="eyebrow">Quest complete</p>
          <h1>You traded scrolling for your actual life.</h1>
          <div class="earned-number">${state.questReward}<span>minutes earned</span></div>
          <div class="confetti" aria-hidden="true">
            <i style="--r:-20deg;--o:.8"></i><i style="--r:18deg;--o:.7"></i><i style="--r:42deg;--o:.9"></i><i style="--r:-34deg;--o:.65"></i><i style="--r:12deg;--o:.8"></i><i style="--r:-12deg;--o:.7"></i>
          </div>
          <div class="spacer"></div>
          <div class="button-stack">
            <button class="btn primary" type="button" data-action="use-earned-now">Use time now</button>
            <button class="btn secondary" type="button" data-action="save-earned">Save for later</button>
          </div>
        </section>`;
      }

      function activeScreen() {
        return `<section class="screen dark" data-screen="active">
          <p class="eyebrow">Intentional screen time</p>
          <h1 style="max-width:none">Enjoy it on purpose.</h1>
          <div class="active-app"><div class="app-icon ig" aria-hidden="true">I</div><span>Instagram</span></div>
          <div class="timer-center">
            <div class="timer-ring" id="activeRing" style="--progress:0%">
              <div><div class="timer-value" id="activeTime">${formatTime(state.timerSeconds)}</div><div class="timer-label">remaining</div></div>
            </div>
            <p class="trust">MOKI will pause Instagram again when the time ends.</p>
          </div>
          <div class="button-stack"><button class="btn secondary" type="button" data-action="end-session">End session</button></div>
        </section>`;
      }

      function relockedScreen() {
        return `<section class="screen" data-screen="relocked">
          <div class="spacer"></div>
          <div class="relock-copy">
            <div class="lock-orb">${icons.lock}</div>
            <p class="eyebrow" style="margin-top:28px">Back to the boundary</p>
            <h1>Time’s up.</h1>
            <p class="sub">Instagram is paused again. Want more time? Earn it with another small real-life action.</p>
          </div>
          <div class="spacer"></div>
          <div class="button-stack">
            <button class="btn primary" type="button" data-go="quests">Take another Side Quest</button>
            <button class="btn secondary" type="button" data-go="home">Back home</button>
          </div>
        </section>`;
      }

      function startQuestTimer() {
        const q = quests[state.selectedQuest];
        state.questReward = q.reward;
        state.timerInitial = 300;
        state.timerSeconds = 300;
        state.timerId = window.setInterval(() => {
          state.timerSeconds = Math.max(0, state.timerSeconds - 1);
          const value = document.getElementById('questTime');
          const ring = document.getElementById('questRing');
          if (value) value.textContent = formatTime(state.timerSeconds);
          if (ring) {
            const progress = ((state.timerInitial - state.timerSeconds) / state.timerInitial) * 100;
            ring.style.setProperty('--progress', `${progress}%`);
          }
          if (state.timerSeconds <= 0) finishQuest();
        }, 1000);
      }

      function startActiveTimer(minutes, reason) {
        state.activeMinutes = minutes;
        state.activeReason = reason;
        state.timerInitial = minutes * 60;
        state.timerSeconds = state.timerInitial;
        go('active');
        state.timerId = window.setInterval(() => {
          state.timerSeconds = Math.max(0, state.timerSeconds - 1);
          const value = document.getElementById('activeTime');
          const ring = document.getElementById('activeRing');
          if (value) value.textContent = formatTime(state.timerSeconds);
          if (ring) {
            const progress = ((state.timerInitial - state.timerSeconds) / state.timerInitial) * 100;
            ring.style.setProperty('--progress', `${progress}%`);
          }
          if (state.timerSeconds <= 0) go('relocked');
        }, 1000);
      }

      function finishQuest() {
        clearTimer();
        go('earned');
      }

      function render() {
        topbar.hidden = ['quest-timer', 'active'].includes(state.screen);
        const views = {
          home: homeScreen,
          locked: lockedScreen,
          quests: questsScreen,
          'quest-timer': questTimerScreen,
          earned: earnedScreen,
          active: activeScreen,
          relocked: relockedScreen
        };
        screenWrap.innerHTML = views[state.screen]();
        if (state.screen === 'quest-timer') startQuestTimer();
      }

      screenWrap.addEventListener('click', (event) => {
        const goTarget = event.target.closest('[data-go]');
        if (goTarget) {
          go(goTarget.dataset.go);
          return;
        }

        const quest = event.target.closest('[data-quest]');
        if (quest) {
          state.selectedQuest = quest.dataset.quest;
          state.questReward = quests[state.selectedQuest].reward;
          render();
          return;
        }

        const action = event.target.closest('[data-action]');
        if (!action) return;

        switch (action.dataset.action) {
          case 'start-quest':
            state.questReward = quests[state.selectedQuest].reward;
            go('quest-timer');
            break;
          case 'finish-quest':
            finishQuest();
            break;
          case 'save-earned':
            state.earnedMinutes += state.questReward;
            notify(`${state.questReward} minutes saved`);
            go('home');
            break;
          case 'use-earned-now':
            startActiveTimer(state.questReward, 'earned');
            break;
          case 'use-bank':
            if (state.earnedMinutes > 0) {
              const minutes = state.earnedMinutes;
              state.earnedMinutes = 0;
              startActiveTimer(minutes, 'bank');
            }
            break;
          case 'intentional':
            startActiveTimer(10, 'intentional');
            break;
          case 'end-session':
            go('relocked');
            break;
          case 'urgent':
            notify('Intentional unlock keeps you in control');
            break;
        }
      });

      resetBtn.addEventListener('click', () => {
        clearTimer();
        state.screen = 'home';
        state.selectedQuest = 'read';
        state.questReward = 10;
        state.earnedMinutes = 0;
        state.activeMinutes = 0;
        state.timerSeconds = 300;
        state.timerInitial = 300;
        render();
        notify('Reset complete');
      });

      window.addEventListener('pagehide', clearTimer);
      render();
    })();
  </script>
</body>
</html>
