name: Install AI task sync

on:
  push:
    paths:
      - ai-tasks.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dopamodoro task manager
        env:
          SYNC_CODE_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          marker = '// ==================== AI TASK SYNC ===================='
          if marker in s:
              print('AI task sync already installed')
              raise SystemExit(0)

          sync_code = base64.b64decode(os.environ['SYNC_CODE_B64']).decode('utf-8')
          anchor = '// ==================== LEVEL TITLES ===================='
          if anchor not in s:
              raise SystemExit('Could not find insertion anchor for sync function')
          s = s.replace(anchor, sync_code + anchor, 1)

          load_anchor = '  // If a timer was running when app last closed, recompute time-left'
          if load_anchor not in s:
              raise SystemExit('Could not find loadState insertion anchor')
          s = s.replace(load_anchor, '  // Pull ChatGPT-managed tasks before rendering local state.\n  await syncAssistantTasks();\n\n' + load_anchor, 1)

          p.write_text(s, encoding='utf-8')
          print('Installed AI task sync')
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes needed"
            exit 0
          fi
          git config user.name "dopamodoro-ai-sync"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "Wire ChatGPT task feed into Dopamodoro"
          git push
